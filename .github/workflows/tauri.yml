name: tauri

# Separate from `build` on purpose. Compiling a Tauri app pulls hundreds of Rust
# crates and takes minutes; the `build` workflow is the fast feedback loop for
# the TypeScript core and should not wait on it. This one runs when the shell, the
# frontend it embeds, the core it spawns, or this file change.
#
# `common/**` is in that list for a specific reason: the end-to-end test below
# spawns the real core that this hand-written Rust client talks to, and it is the
# only test that would notice a core change breaking that client — the TypeScript
# smoke test in `build.yml` drives the core with the official client, which cannot
# fail that way. The cost is a slow job on core changes; the alternative is a
# blind spot on the one boundary with no SDK underneath it.
on:
  push:
    branches: [main]
    paths:
      - 'src-tauri/**'
      - 'variants/desktop/**'
      - 'common/**'
      - '.github/workflows/tauri.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src-tauri/**'
      - 'variants/desktop/**'
      - 'common/**'
      - '.github/workflows/tauri.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo-check:
    name: cargo check (linux)
    runs-on: ubuntu-latest

    # Linux only for now. A Tauri app compiles on all three platforms, but the
    # first goal is a fast signal that the Rust side and the configuration are
    # sound; widening the matrix comes after that holds.
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # `tauri::generate_context!()` embeds `frontendDist` into the binary at
      # compile time, so the directory must exist before cargo runs.
      - name: Build frontend
        run: npm run build:desktop

      # Packages are installed one at a time and a missing one only warns, so a
      # renamed package cannot fail the whole job. The webkit2gtk and gtk
      # development headers are required: their build scripts locate the
      # libraries through pkg-config.
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          for pkg in libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf libssl-dev libayatana-appindicator3-dev; do
            sudo apt-get install -y --no-install-recommends "$pkg" \
              || echo "::warning::could not install $pkg"
          done

      - name: Setup Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          cargo --version
          rustc --version

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: cargo-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.toml') }}
          restore-keys: cargo-${{ runner.os }}-

      # Raw job logs require authentication to download, but check-run
      # annotations do not. `--message-format=short` already puts file, line and
      # column on the same line as the message, so each error becomes a readable
      # annotation instead of a bare red X.
      - name: cargo check
        shell: bash
        run: |
          set +e
          cargo check --manifest-path src-tauri/Cargo.toml \
            --message-format=short 2>&1 | tee cargo-check.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E ': error' cargo-check.log | head -10 | while IFS= read -r line; do
              printf '::error::%s\n' "$line"
            done
          fi
          exit "$status"

      # The end-to-end handshake test spawns the *real* core, so the bundle has to
      # exist before cargo runs. The step above only produced the UI.
      - name: Build core
        run: npm run build

      # The bridge and mcp modules are Tauri-free on purpose so their tests run
      # here, with no display and no window. This is what makes the sidecar
      # verifiable in CI rather than only on a developer machine.
      #
      # `--include-ignored` runs the end-to-end handshake test. It is marked
      # ignored because it needs a built core and Node on PATH, and a test that
      # silently passes when its subject is absent would be worse than none.
      # `--nocapture` lets it emit a ::notice:: line, which becomes a check-run
      # annotation — the only way to read what the core actually negotiated
      # without downloading the raw job log, which needs authentication.
      - name: cargo test
        shell: bash
        env:
          NEXUS_CORE_WORKSPACE: ${{ github.workspace }}
        run: |
          set +e
          cargo test --manifest-path src-tauri/Cargo.toml \
            --message-format=short -- --include-ignored --nocapture 2>&1 | tee cargo-test.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E ': error' cargo-test.log | head -10 | while IFS= read -r line; do
              printf '::error::%s\n' "$line"
            done
            grep -E 'panicked at' cargo-test.log | head -5 | while IFS= read -r line; do
              printf '::error::%s\n' "$line"
            done
            grep -E '^test .* FAILED' cargo-test.log | head -10 | while IFS= read -r line; do
              printf '::error::%s\n' "$line"
            done
            # The core logs to stderr, and a failed handshake test prints those
            # lines as part of its panic payload. Surfacing them as annotations is
            # what turns "the handshake failed" into "the core said this".
            grep -E '^\[nexus\]' cargo-test.log | head -10 | while IFS= read -r line; do
              printf '::warning::core stderr: %s\n' "$line"
            done
          fi
          exit "$status"
