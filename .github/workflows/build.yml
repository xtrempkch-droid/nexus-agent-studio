name: Build e Compilação Multiplataforma

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Permite disparar a compilação manualmente na aba Actions

jobs:
  build:
    name: Compilar para ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: app-linux
            asset_name: app-linux
          - os: windows-latest
            artifact_name: app-windows.exe
            asset_name: app-windows.exe
          - os: macos-latest
            artifact_name: app-macos
            asset_name: app-macos

    steps:
    - name: Baixar o código do repositório
      uses: actions/checkout@v4

    - name: Configurar o ambiente Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instalar dependências necessárias
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      shell: bash

    - name: Compilar o executável
      run: |
        pyinstaller --onefile --name ${{ matrix.asset_name }} main.py
      shell: bash

    - name: Disponibilizar o arquivo gerado (Artefato)
      uses: actions/upload-artifact@v4
      with:
        name: Executavel-${{ matrix.os }}
        path: dist/${{ matrix.asset_name }}*
