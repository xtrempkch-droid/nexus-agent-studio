name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['22', '24']

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          # NOTE: re-enable `cache: npm` once package-lock.json is committed.
          # setup-node fails outright when the cache is requested but no
          # lockfile is present.

      # `npm ci` requires a committed lockfile. Until package-lock.json exists
      # (it cannot be generated without Node.js installed), fall back to
      # `npm install` so the pipeline stays green. Commit a lockfile — then this
      # step can go back to a plain `npm ci`.
      - name: Install dependencies
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            echo "::warning::package-lock.json not found; using npm install. Commit a lockfile to restore reproducible installs."
            npm install --no-audit --no-fund
          fi

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build (core)
        run: npm run build
