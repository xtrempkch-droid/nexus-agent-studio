name: Bug report
description: Report a defect in NexusAgent Studio
title: '[bug] '
labels: ['bug', 'triage']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. Please fill every field so we can reproduce it.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect instead?
      placeholder: A clear and concise description of the defect.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Exact, minimal steps.
      placeholder: |
        1. Run `npm run dev:desktop`
        2. Ask the agent to ...
        3. Observe ...
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system and version
      placeholder: e.g. Windows 11 23H2 / macOS 15.2 / Ubuntu 24.04
    validations:
      required: true

  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: output of `node --version`
    validations:
      required: true

  - type: input
    id: docker
    attributes:
      label: Local Docker version
      description: Output of `docker version --format '{{.Server.Version}}'`
      placeholder: e.g. 27.5.1
    validations:
      required: true

  - type: textarea
    id: compiler-logs
    attributes:
      label: Compiler / stderr logs
      description: Paste the failing output. Include the exit code if known.
      render: shell
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Screenshots, config, related issues.
    validations:
      required: false
