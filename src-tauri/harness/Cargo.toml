[package]
name = "nexus-shell-harness"
version = "0.1.0"
edition = "2021"
publish = false

# Its own workspace root, deliberately. Without this, Cargo walks up looking for
# a workspace and finds `src-tauri/Cargo.toml`, which is a package rather than a
# workspace root — the classic "believes it's in a workspace when it's not" error.
[workspace]

[dependencies]
# The same dependency the real crate uses for these modules, and the only one
# they need: `bridge.rs` and `mcp.rs` are std + `serde_json`.
serde_json = "1"

[lib]
# Named so the test output says what it is.
name = "nexus_shell_harness"
path = "src/lib.rs"
